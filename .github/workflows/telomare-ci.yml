# comment to fire up github actions 2
name: "Telomare CI"
on:
  pull_request:
  push:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # The Nix `nix run .#push-cachix` is run with: `nix develop` wraps a shell
    # in a derivation built from that Nix's own get-env.sh, so only the same
    # version finds the published environment in the cache. The installer
    # sets `access-tokens` from the job's token.
    - uses: DeterminateSystems/determinate-nix-action@v3.23.3
      with:
        diagnostic-endpoint: ""
        extra-conf: |
          accept-flake-config = true
    # The telomare cache signs with a Cachix-managed key, so pushing takes an
    # auth token with write access; a signing key alone is refused (403).
    # Pull requests from forks get no secrets and only pull.
    - uses: cachix/cachix-action@v17
      with:
        name: telomare
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        extraPullNames: ekala-corepkgs
    - name: Check and test
      run: |
        nix -Lv flake check
